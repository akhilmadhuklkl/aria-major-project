<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Figure 3.1: Proposed System Architecture of ARIA</title>
  <desc id="desc">Black and white architecture diagram showing ARIA frontend modules, backend API, SQLite database, semantic retrieval, Mastra AI, Gemini, feedback storage, and analytics dashboard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <style>
      .page { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2.2; rx: 10; }
      .group { fill: #ffffff; stroke: #111111; stroke-width: 2.6; rx: 14; }
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #111111; }
      .section { font: 700 22px Arial, Helvetica, sans-serif; fill: #111111; }
      .label { font: 700 18px Arial, Helvetica, sans-serif; fill: #111111; }
      .text { font: 15px Arial, Helvetica, sans-serif; fill: #111111; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #111111; }
      .arrow { stroke: #111111; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #111111; stroke-width: 1.6; fill: none; }
      .dash { stroke: #111111; stroke-width: 1.8; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1400" height="900"/>

  <text class="title" x="700" y="55" text-anchor="middle">Proposed System Architecture of ARIA</text>
  <text class="text" x="700" y="85" text-anchor="middle">AI-assisted customer support system with frontend, backend, database persistence, semantic retrieval, and AI response generation</text>

  <!-- Users -->
  <rect class="group" x="60" y="150" width="210" height="560"/>
  <text class="section" x="165" y="185" text-anchor="middle">Users</text>

  <rect class="box" x="90" y="240" width="150" height="90"/>
  <text class="label" x="165" y="278" text-anchor="middle">Customer</text>
  <text class="small" x="165" y="304" text-anchor="middle">asks support</text>
  <text class="small" x="165" y="322" text-anchor="middle">questions</text>

  <rect class="box" x="90" y="520" width="150" height="90"/>
  <text class="label" x="165" y="558" text-anchor="middle">Support Agent</text>
  <text class="small" x="165" y="584" text-anchor="middle">reviews AI</text>
  <text class="small" x="165" y="602" text-anchor="middle">suggestions</text>

  <!-- Frontend -->
  <rect class="group" x="330" y="120" width="290" height="620"/>
  <text class="section" x="475" y="155" text-anchor="middle">React + TypeScript Frontend</text>

  <rect class="box" x="365" y="205" width="220" height="72"/>
  <text class="label" x="475" y="235" text-anchor="middle">Customer Chat</text>
  <text class="small" x="475" y="258" text-anchor="middle">question and response view</text>

  <rect class="box" x="365" y="320" width="220" height="72"/>
  <text class="label" x="475" y="350" text-anchor="middle">Agent Workspace</text>
  <text class="small" x="475" y="373" text-anchor="middle">accept, edit, reject, regenerate</text>

  <rect class="box" x="365" y="435" width="220" height="72"/>
  <text class="label" x="475" y="465" text-anchor="middle">Knowledge Base</text>
  <text class="small" x="475" y="488" text-anchor="middle">verified support records</text>

  <rect class="box" x="365" y="550" width="220" height="72"/>
  <text class="label" x="475" y="580" text-anchor="middle">Analytics Dashboard</text>
  <text class="small" x="475" y="603" text-anchor="middle">quality and activity metrics</text>

  <rect class="box" x="365" y="650" width="220" height="52"/>
  <text class="label" x="475" y="682" text-anchor="middle">Settings / Health Status</text>

  <!-- Backend -->
  <rect class="group" x="705" y="120" width="300" height="620"/>
  <text class="section" x="855" y="155" text-anchor="middle">Express + TypeScript Backend</text>

  <rect class="box" x="745" y="205" width="220" height="70"/>
  <text class="label" x="855" y="235" text-anchor="middle">REST API Layer</text>
  <text class="small" x="855" y="258" text-anchor="middle">chat, knowledge, feedback, analytics</text>

  <rect class="box" x="745" y="320" width="220" height="70"/>
  <text class="label" x="855" y="350" text-anchor="middle">Conversation Service</text>
  <text class="small" x="855" y="373" text-anchor="middle">messages and support flow</text>

  <rect class="box" x="745" y="435" width="220" height="70"/>
  <text class="label" x="855" y="465" text-anchor="middle">Semantic Retrieval</text>
  <text class="small" x="855" y="488" text-anchor="middle">embedding similarity search</text>

  <rect class="box" x="745" y="550" width="220" height="70"/>
  <text class="label" x="855" y="580" text-anchor="middle">Agent Service</text>
  <text class="small" x="855" y="603" text-anchor="middle">AI response orchestration</text>

  <rect class="box" x="745" y="650" width="220" height="52"/>
  <text class="label" x="855" y="682" text-anchor="middle">Analytics Service</text>

  <!-- Data and AI -->
  <rect class="group" x="1090" y="120" width="250" height="620"/>
  <text class="section" x="1215" y="155" text-anchor="middle">Data and AI Services</text>

  <rect class="box" x="1120" y="205" width="190" height="80"/>
  <text class="label" x="1215" y="236" text-anchor="middle">SQLite Database</text>
  <text class="small" x="1215" y="260" text-anchor="middle">conversations, messages,</text>
  <text class="small" x="1215" y="278" text-anchor="middle">knowledge, feedback</text>

  <rect class="box" x="1120" y="345" width="190" height="80"/>
  <text class="label" x="1215" y="376" text-anchor="middle">Hugging Face</text>
  <text class="small" x="1215" y="400" text-anchor="middle">Transformers.js embeddings</text>

  <rect class="box" x="1120" y="485" width="190" height="80"/>
  <text class="label" x="1215" y="516" text-anchor="middle">Mastra AI Server</text>
  <text class="small" x="1215" y="540" text-anchor="middle">deployed agent endpoint</text>

  <rect class="box" x="1120" y="625" width="190" height="80"/>
  <text class="label" x="1215" y="656" text-anchor="middle">Gemini Model</text>
  <text class="small" x="1215" y="680" text-anchor="middle">grounded response generation</text>

  <!-- Main arrows -->
  <path class="arrow" d="M 240 285 L 365 240"/>
  <text class="small" x="305" y="245" text-anchor="middle">question</text>

  <path class="arrow" d="M 240 565 L 365 356"/>
  <text class="small" x="307" y="440" text-anchor="middle">review action</text>

  <path class="arrow" d="M 585 240 L 745 240"/>
  <text class="small" x="665" y="225" text-anchor="middle">API request</text>

  <path class="arrow" d="M 745 258 L 585 258"/>
  <text class="small" x="665" y="286" text-anchor="middle">AI response</text>

  <path class="arrow" d="M 585 356 L 745 356"/>
  <text class="small" x="665" y="342" text-anchor="middle">agent decision</text>

  <path class="arrow" d="M 585 471 L 745 471"/>
  <text class="small" x="665" y="457" text-anchor="middle">knowledge CRUD</text>

  <path class="arrow" d="M 745 665 L 585 586"/>
  <text class="small" x="660" y="635" text-anchor="middle">metrics</text>

  <path class="arrow" d="M 965 240 L 1120 245"/>
  <text class="small" x="1042" y="228" text-anchor="middle">store / read</text>

  <path class="arrow" d="M 965 470 L 1120 385"/>
  <text class="small" x="1042" y="415" text-anchor="middle">generate embeddings</text>

  <path class="arrow" d="M 965 585 L 1120 525"/>
  <text class="small" x="1042" y="548" text-anchor="middle">agent call</text>

  <path class="arrow" d="M 1215 565 L 1215 625"/>
  <text class="small" x="1275" y="600" text-anchor="middle">LLM provider</text>

  <path class="dash" d="M 1120 665 C 1040 700 1020 690 965 670"/>
  <text class="small" x="1072" y="720" text-anchor="middle">generated answer and usage signals</text>

  <path class="line" d="M 855 275 L 855 320"/>
  <path class="line" d="M 855 390 L 855 435"/>
  <path class="line" d="M 855 505 L 855 550"/>
  <path class="line" d="M 855 620 L 855 650"/>

  <text class="small" x="700" y="810" text-anchor="middle">Figure 3.1: Proposed system architecture of ARIA</text>
</svg>
