name: ARIA CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: aria-app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aria-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
      - name: Build production container
        run: docker build --tag aria-app:ci .
      - name: Start API smoke-test process
        run: npm run start:server > /tmp/aria-api.log 2>&1 &
      - name: Verify API readiness
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/api/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aria-api.log
          exit 1
      - name: Run read-only API smoke check
        run: npm run check:api
      - name: Run production container smoke test
        run: |
          set -e
          trap 'docker logs aria-api-ci || true; docker rm --force aria-api-ci || true' EXIT
          docker run --detach --name aria-api-ci --publish 8788:8787 --env PORT=8787 aria-app:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8788/api/ready; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aria
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: aria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aria -d aria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: aria-app
    env:
      DATABASE_URL: postgresql://aria:ci-password@localhost:5432/aria
      DB_SSL: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aria-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Migrate SQLite data to PostgreSQL
        run: npm run migrate:postgres
      - name: Verify PostgreSQL schema and indexes
        run: npm run verify:postgres
