name: ARIA CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: aria-app

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aria-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:production
      - name: Run lint
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
      - name: Build production container
        run: docker build --tag aria-app:ci .
      - name: Start API smoke-test process
        run: npm run start:server > /tmp/aria-api.log 2>&1 &
      - name: Verify API readiness
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/api/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aria-api.log
          exit 1
      - name: Run read-only API smoke check
        run: npm run check:api
      - name: Run production container smoke test
        run: |
          set -e
          trap 'docker logs aria-api-ci || true; docker rm --force aria-api-ci || true' EXIT
          docker run --detach --name aria-api-ci --publish 8788:8787 --env PORT=8787 aria-app:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8788/api/ready; then
              curl --fail --silent http://127.0.0.1:8788/ | grep --quiet '<div id="root"></div>'
              exit 0
            fi
            sleep 1
          done
          exit 1

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aria
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: aria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aria -d aria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: aria-app
    env:
      DATABASE_URL: postgresql://aria:ci-password@localhost:5432/aria
      DB_SSL: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aria-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Initialize SQLite migration source
        run: node --disable-warning=ExperimentalWarning --import tsx -e "import { db } from './server/database.ts'; import { ensureAuthSchema } from './server/auth.ts'; ensureAuthSchema(); db.close()"
      - name: Run PostgreSQL migration preflight
        run: npm run preflight:postgres
      - name: Migrate SQLite data to PostgreSQL
        run: npm run migrate:postgres
      - name: Verify PostgreSQL schema and indexes
        run: npm run verify:postgres
      - name: Create and validate PostgreSQL backup archive
        env:
          POSTGRES_BACKUP_PATH: backups/aria-ci.dump
        run: npm run backup:postgres
      - name: Create disposable PostgreSQL restore database
        env:
          PGPASSWORD: ci-password
        run: createdb --host=localhost --username=aria --no-password aria_restore
      - name: Restore PostgreSQL backup to disposable database
        env:
          DATABASE_URL: postgresql://aria:ci-password@localhost:5432/aria_restore
          DB_SSL: false
          POSTGRES_BACKUP_PATH: backups/aria-ci.dump
          POSTGRES_RESTORE_CONFIRM: YES
        run: npm run restore:postgres
      - name: Verify restored PostgreSQL database
        env:
          DATABASE_URL: postgresql://aria:ci-password@localhost:5432/aria_restore
          DB_SSL: false
        run: npm run verify:postgres
      - name: Remove disposable PostgreSQL restore database
        if: always()
        env:
          PGPASSWORD: ci-password
        run: dropdb --host=localhost --username=aria --no-password --if-exists aria_restore
      - name: Run PostgreSQL repository integration tests
        run: npm run test:postgres
      - name: Start PostgreSQL runtime API
        env:
          DATABASE_ENGINE: postgres
          PORT: 8787
        run: npm run start:server > /tmp/aria-postgres-api.log 2>&1 &
      - name: Verify PostgreSQL runtime readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/api/ready | grep --quiet '"database":"postgres"'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aria-postgres-api.log
          exit 1
      - name: Run PostgreSQL runtime API smoke check
        env:
          VALIDATION_API_URL: http://127.0.0.1:8787/api
        run: npm run check:api
