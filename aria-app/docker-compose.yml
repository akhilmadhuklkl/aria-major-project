services:
  aria-api:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      PORT: 8787
    init: true
    volumes:
      - aria-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    profiles: [postgres, postgres-runtime]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-aria}"
      POSTGRES_USER: "${POSTGRES_USER:-aria}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting PostgreSQL}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  aria-api-postgres:
    build: .
    profiles: [postgres-runtime]
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      PORT: 8787
      DATABASE_ENGINE: postgres
      DATABASE_URL: "${POSTGRES_CONTAINER_DATABASE_URL:?Set POSTGRES_CONTAINER_DATABASE_URL in .env before starting the PostgreSQL runtime}"
      DB_SSL: "${DB_SSL:-false}"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  neo4j:
    image: neo4j:5-community
    profiles: [neo4j]
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env before starting the Neo4j profile}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env before starting the Neo4j profile}"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$NEO4J_PASSWORD\" 'RETURN 1' > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  aria-data:
  postgres-data:
  neo4j-data:
  neo4j-logs:
