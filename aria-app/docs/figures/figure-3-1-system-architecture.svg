  <path d="M1000 550 C945 610 690 635 490 565 C360 520 280 450 245 415" class="arrow" />
  <text x="662" y="650" text-anchor="middle" class="small-text">Generated response, confidence score, sources, feedback and analytics flow back to the interface</text>

  <rect x="330" y="675" width="540" height="45" class="box" />
  <text x="600" y="704" text-anchor="middle" class="box-text">ARIA combines user interface, backend APIs, SQLite persistence, semantic retrieval, Mastra AI, Gemini, and analytics.</text>
